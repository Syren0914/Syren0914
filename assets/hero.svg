<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="556" viewBox="0 0 1200 556" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0B14"/>
      <stop offset="1" stop-color="#11111F"/>
    </linearGradient>
    <linearGradient id="name" x1="60" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C9B8FF"/>
      <stop offset="1" stop-color="#7CF3C2"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7F5AF0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7F5AF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2CB67D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2CB67D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#gridFade)"/></mask>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <linearGradient id="motto" x1="0" y1="400" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9B8FF"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="470" x2="0" y2="544" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2CB67D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2CB67D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cardGlowP" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#7F5AF0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7F5AF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlowG" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#2CB67D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2CB67D" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ui   { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes driftA { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,30px) } }
      @keyframes driftB { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-70px,-25px) } }
      @keyframes rise   { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes blink  { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes pulse  { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }
      .orbA { animation: driftA 14s ease-in-out infinite; }
      .orbB { animation: driftB 17s ease-in-out infinite; }
      .r1 { animation: rise .8s ease-out both; }
      .r2 { animation: rise .8s ease-out .15s both; }
      .r3 { animation: rise .8s ease-out .3s both; }
      .r4 { animation: rise .8s ease-out .45s both; }
      .r5 { animation: rise .9s ease-out .6s both; }
      .cursor { animation: blink 1.1s step-end infinite; }
      @keyframes draw { from { stroke-dashoffset: 1200 } to { stroke-dashoffset: 0 } }
      @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
      .line { stroke-dasharray: 1200; animation: draw 2.4s ease-out .8s both; }
      .areaf { animation: fadeIn 1.2s ease-out 2s both; }
      .b1 { animation: rise .8s ease-out .7s both; }
      .b2 { animation: rise .8s ease-out .85s both; }
      .b3 { animation: rise .8s ease-out 1s both; }
      .lbl { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; letter-spacing: 2px; fill: #6E6E88; }
      .dot { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle class="orbA" cx="980" cy="60" r="260" fill="url(#orbA)"/>
    <circle class="orbB" cx="760" cy="330" r="230" fill="url(#orbB)"/>
    <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridMask)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Left: intro -->
  <g class="r1">
    <rect x="64" y="62" width="132" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle class="dot" cx="84" cy="77" r="5" fill="#2CB67D"/>
    <text x="98" y="82" class="mono" font-size="13" fill="#B8B8D0">erdene.dev</text>
  </g>

  <text x="62" y="160" class="ui r2" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Erdene Batbayar</text>

  <text x="64" y="202" class="ui r3" font-size="21" fill="#A1A1B5">Computer Science &amp; Engineering student building</text>
  <text x="64" y="230" class="ui r3" font-size="21" fill="#A1A1B5">web apps and open hardware.</text>

  <g class="r4"><g class="mono" font-size="13">
    <rect x="64" y="262" width="96" height="30" rx="8" fill="#7F5AF0" fill-opacity="0.15" stroke="#7F5AF0" stroke-opacity="0.4"/>
    <text x="112" y="282" text-anchor="middle" fill="#C9B8FF">Web</text>
    <rect x="170" y="262" width="116" height="30" rx="8" fill="#2CB67D" fill-opacity="0.13" stroke="#2CB67D" stroke-opacity="0.4"/>
    <text x="228" y="282" text-anchor="middle" fill="#7CF3C2">Hardware</text>
    <rect x="296" y="262" width="80" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="336" y="282" text-anchor="middle" fill="#D0D0E0">Data</text>
  </g></g>

  <!-- Right: terminal card -->
  <g class="r5">
    <rect x="770" y="70" width="366" height="206" rx="16" fill="#0E0E1A" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="794" cy="94" r="6" fill="#FF5F57"/>
    <circle cx="814" cy="94" r="6" fill="#FEBC2E"/>
    <circle cx="834" cy="94" r="6" fill="#28C840"/>
    <text x="1112" y="99" text-anchor="end" class="mono" font-size="12" fill="#5F5F78">~/syren0914</text>
    <line x1="770" y1="116" x2="1136" y2="116" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <g class="mono" font-size="14">
      <text x="794" y="148"><tspan fill="#7F5AF0">const</tspan><tspan fill="#E4E4F0"> me = {</tspan></text>
      <text x="814" y="174"><tspan fill="#8E8EA8">stack: </tspan><tspan fill="#7CF3C2">"Next.js · TS"</tspan><tspan fill="#E4E4F0">,</tspan></text>
      <text x="814" y="198"><tspan fill="#8E8EA8">hw:    </tspan><tspan fill="#7CF3C2">"ESP32 · Arduino"</tspan><tspan fill="#E4E4F0">,</tspan></text>
      <text x="814" y="222"><tspan fill="#8E8EA8">club:  </tspan><tspan fill="#7CF3C2">"NVCC Tech Club"</tspan></text>
      <text x="794" y="248" fill="#E4E4F0">};</text>
      <rect class="cursor" x="816" y="236" width="9" height="16" fill="#C9B8FF"/>
    </g>
  </g>

  <!-- ===== Bento row ===== -->
  <g class="b1">
    <rect x="0.5" y="356.5" width="591" height="199" rx="20" fill="#0D0D17"/>
    <rect x="0.5" y="356.5" width="591" height="199" rx="20" fill="url(#cardGlowG)"/>
    <rect x="0.5" y="356.5" width="591" height="199" rx="20" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="28" y="392" class="lbl">NOW BUILDING</text>
    <text x="28" y="430" class="ui" font-size="30" font-weight="700" fill="#F2F2FA" letter-spacing="-0.5">AirNode</text>
    <text x="28" y="456" class="ui" font-size="15" fill="#8E8EA8">ESP32-C3 air-quality monitor</text>
    <g transform="translate(486 374)">
      <rect width="80" height="26" rx="13" fill="#2CB67D" fill-opacity="0.12" stroke="#2CB67D" stroke-opacity="0.35"/>
      <circle class="dot" cx="16" cy="13" r="4" fill="#2CB67D"/>
      <text x="27" y="17.5" class="mono" font-size="12" fill="#7CF3C2">CO₂ ppm</text>
    </g>
    <path class="areaf" d="M28.0,544 L28.0,512.0 L51.3,518.0 L74.6,508.4 L97.9,503.6 L121.2,520.4 L144.5,527.6 L167.8,518.0 L191.1,498.8 L214.4,491.6 L237.7,506.0 L261.0,515.6 L284.3,524.0 L307.7,530.0 L331.0,521.6 L354.3,508.4 L377.6,494.0 L400.9,484.4 L424.2,496.4 L447.5,512.0 L470.8,518.0 L494.1,510.8 L517.4,502.4 L540.7,509.6 L564.0,515.6 L564.0,544 Z" fill="url(#area)"/>
    <polyline class="line" points="28.0,512.0 51.3,518.0 74.6,508.4 97.9,503.6 121.2,520.4 144.5,527.6 167.8,518.0 191.1,498.8 214.4,491.6 237.7,506.0 261.0,515.6 284.3,524.0 307.7,530.0 331.0,521.6 354.3,508.4 377.6,494.0 400.9,484.4 424.2,496.4 447.5,512.0 470.8,518.0 494.1,510.8 517.4,502.4 540.7,509.6 564.0,515.6" stroke="#2CB67D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <circle class="dot" cx="564.0" cy="515.6" r="4.5" fill="#7CF3C2"/>
  </g>

  <g class="b2">
    <rect x="608.5" y="356.5" width="287" height="199" rx="20" fill="#0D0D17" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="636" y="392" class="lbl">FOCUS</text>
    <g class="ui" font-size="19" fill="#E4E4F0">
      <rect x="636" y="420" width="10" height="10" rx="3" fill="#9D7CFF"/><text x="658" y="430">Web apps</text>
      <rect x="636" y="460" width="10" height="10" rx="3" fill="#2CB67D"/><text x="658" y="470">Open hardware</text>
      <rect x="636" y="500" width="10" height="10" rx="3" fill="#E4E4F0"/><text x="658" y="510">Data &amp; analysis</text>
    </g>
  </g>

  <g class="b3">
    <rect x="912.5" y="356.5" width="287" height="199" rx="20" fill="#0D0D17"/>
    <rect x="912.5" y="356.5" width="287" height="199" rx="20" fill="url(#cardGlowP)"/>
    <rect x="912.5" y="356.5" width="287" height="199" rx="20" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="940" y="392" class="lbl">MOTTO</text>
    <g class="ui" font-size="28" font-weight="700" letter-spacing="-0.5" fill="url(#motto)">
      <text x="940" y="440">Try. Fail.</text>
      <text x="940" y="476">Learn.</text>
      <text x="940" y="512">Try again.</text>
    </g>
  </g>
</svg>
